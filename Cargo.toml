[workspace]
resolver = "2"
members = [
  "crates/i18n",
  "crates/core",
  "crates/definitions",
  "crates/database",
  "crates/blaze-networking",
]

[workspace.package]
authors = ["Jacobtread <jacobtread@gmail.com>"]
repository = "https://github.com/PocketRelay/PocketArk"
readme = "./README.md"
license = "MIT"
keywords = ["EA", "PocketArk", "MassEffectAndromeda"]
edition = "2024"

[workspace.dependencies]
# Serialization
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
serde_path_to_error = "0.1.20"
serde_with = "3.16.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Date time
chrono = { version = "^0.4.42", features = ["serde", "alloc"] }

# UUIDs
uuid = { version = "^1", features = ["v4", "serde", "fast-rng"] }

itertools = "0.15.0"
tracing = "0.1.44"

# String enums
strum = { version = "0.28.0", features = ["derive"] }


# Random number generation
rand = "0.8"

# Numeric enums
num_enum = "0.7.5"

# Async runtime and utilities
tokio = { version = "^1", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["full"] }
futures = "^0.3.32"

# TDF packet format
tdf = { version = "0.4", features = ["bytes"] }

# Bit flags
bitflags = { version = "2.10", features = ["serde"] }

# Cheaply cloned bytes
bytes = "1.11.0"


# HTTP framework and related dependencies
hyper = { version = "^1.10.1", features = ["full"] }
hyper-util = { version = "0.1.18", features = ["tokio"] }


pocket-ark-i18n = { version = "0.0.0", path = "./crates/i18n" }
pocket-ark-core = { version = "0.0.0", path = "./crates/core" }
pocket-ark-definitions = { version = "0.0.0", path = "./crates/definitions" }
pocket-ark-database = { version = "0.0.0", path = "./crates/database" }
pocket-ark-blaze-networking = { version = "0.0.0", path = "./crates/blaze-networking" }

[package]
name = "pocket-ark"
version = "0.0.1-alpha.1"
description = "Mass Effect Andromeda private server"

edition.workspace = true
license.workspace = true
keywords.workspace = true
authors.workspace = true

[dependencies]
pocket-ark-i18n.workspace = true
pocket-ark-core.workspace = true
pocket-ark-definitions.workspace = true
pocket-ark-database.workspace = true
pocket-ark-blaze-networking.workspace = true

# HTTP framework and related dependencies
axum = { version = "^0.8.9", features = ["tracing", "tower-log"] }
tower = "^0.5.3"
tower-http = { version = "^0.7.0", features = ["full"] }

hyper.workspace = true
hyper-util.workspace = true

# Async runtime and utilities
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

# Logging
log = { version = "^0.4.33", features = ["serde"] }
log-panics = { version = "2.1.0", features = ["with-backtrace"] }

# Serialization
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
serde_path_to_error = "0.1.20"
serde_with = "3.16.1"

# Bit flags
bitflags.workspace = true

# Cheaply cloned bytes
bytes.workspace = true

# Unique IDs
uuid.workspace = true

# Date and time
chrono.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Environment variables
dotenvy = "^0.15.7"

# Cryptography and hashing
ring = "^0.17.14"
argon2 = { version = "0.5.3", features = ["std"] }

# Base64
base64ct = { version = "1.8.0", features = ["alloc"] }

# Random number generation
rand.workspace = true

# TDF packet format
tdf.workspace = true

# Locks
parking_lot = "0.12.5"

# Numeric enums
num_enum.workspace = true
strum.workspace = true

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# UDP tunnel impl
pocket-relay-udp-tunnel = "0.0.0"

# Library for obtaining the local IP address of the device
local-ip-address = "0.6"
http-body-util = "0.1.4"
async-trait = "0.1.92"

itertools.workspace = true
tracing.workspace = true

# Logging backend
[dependencies.log4rs]
version = "1.3.0"
default-features = false
features = ["console_appender", "file_appender"]

# HTTP Client
[dependencies.reqwest]
version = "0.13.4"
features = ["json"]
